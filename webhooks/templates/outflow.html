<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova saída no SGE</title>
</head>
  <body>
    <div class="container">
      <p><h3>Nova saída registrada no SGE!</h3></p><br>
      <p>Produto: <b>{{ product }}</b></p>
      <p>Quantidade: <b>{{ quantity }}</b></p>
      <p>Valor da venda: <b>R$ {{ total_value_selling }}</b></p>
      <p>Lucro da venda: <b>R$ {{ profit_value }}</b></p>
      <p>Data do registro: <b>{{ timestamp }}</b></p>
      <br><br>
      <p>
        Atenciosamente, <br>
        Sistema de Gestão de Estoque (SGE)
      </p>
    </div>
  </body>
</html>
